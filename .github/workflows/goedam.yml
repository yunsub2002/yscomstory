name: 괴담 영상 자동 제작

on:
  schedule:
    - cron: '37 10 * * 1,4'   # 매주 월·목 19:37 (한국 시간) 제작 시작 → 약 20:30 업로드 · 25분 괴담 모음
  workflow_dispatch:
    inputs:
      mode:
        description: '무엇을 만들까요 (episode = 20~30분 괴담 모음)'
        type: choice
        default: episode
        options: [episode, short]
      minutes:
        description: '목표 길이(분, 20~30)'
        default: '25'

permissions:
  contents: write
  pages: read

concurrency:
  group: goedam
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 프로그램 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install -q supertonic playwright soundfile numpy
          python -m playwright install --with-deps chromium
      - name: AI 목소리 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/supertonic3
          key: supertonic3-model-v1
      - name: 영상 만들기 + 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event.inputs.mode || 'episode' }}
          SHORTS: '0'
          EP_DAYS: '0,3'
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          MINUTES: ${{ github.event.inputs.minutes || '25' }}
          CHANNEL: ''
        run: python goedam_bot/weekly.py
